# cargo-audit configuration for the Security Audit CI job (`cargo audit`).
#
# Every ignore below is documented, transitive, and blocked on a MAJOR
# version bump of a direct dependency — it cannot be cleared by a lockfile
# update. Unmaintained/unsound warnings for other transitive crates are
# NOT ignored: they stay visible in the CI output.
#
# Root causes:
# - protobuf 2.28.0: pinned by the `prometheus` crate. Fix = protobuf 3 /
#   a prometheus release built on it.
#
# The rustls-webpki 0.101 and h2 0.3 ignores were dropped once the HTTP
# clients and kube moved to hyper 1 (the rustls 0.23 stack, webpki 0.103+,
# h2 0.4).

[advisories]
ignore = [
    # protobuf 2.28.0 — fixed in 3.x; pinned by the prometheus crate
    "RUSTSEC-2024-0437",
]
